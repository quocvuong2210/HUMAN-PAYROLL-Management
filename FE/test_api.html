<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test API - Departments & Positions</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 1200px;
            margin: 50px auto;
            padding: 20px;
            background: #0f172a;
            color: #e2e8f0;
        }
        h1 {
            color: #3b82f6;
            border-bottom: 3px solid #3b82f6;
            padding-bottom: 10px;
        }
        .section {
            background: #1e293b;
            padding: 20px;
            margin: 20px 0;
            border-radius: 10px;
            border: 1px solid #334155;
        }
        button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            margin: 5px;
            transition: all 0.2s;
        }
        button:hover {
            background: #2563eb;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
        }
        button:active {
            transform: translateY(0);
        }
        .result {
            background: #0f172a;
            padding: 15px;
            margin-top: 15px;
            border-radius: 8px;
            border: 1px solid #334155;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            max-height: 400px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .success {
            color: #10b981;
        }
        .error {
            color: #ef4444;
        }
        .info {
            color: #3b82f6;
        }
        .warning {
            color: #f59e0b;
        }
        select {
            background: #0f172a;
            color: #e2e8f0;
            border: 1px solid #334155;
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
            min-width: 200px;
            margin: 10px 5px;
        }
        .status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
            margin-left: 10px;
        }
        .status.ok {
            background: #10b981;
            color: white;
        }
        .status.fail {
            background: #ef4444;
            color: white;
        }
    </style>
</head>
<body>
    <h1>🧪 Test API - Departments & Positions</h1>
    
    <div class="section">
        <h2>📍 API Configuration</h2>
        <p><strong>Base URL:</strong> <span id="baseUrl" class="info">http://localhost:5000</span></p>
        <p><strong>Departments:</strong> <span class="info">/api/v1/departments/</span></p>
        <p><strong>Positions:</strong> <span class="info">/api/v1/positions/</span></p>
    </div>

    <div class="section">
        <h2>🔍 Test 1: Fetch Departments</h2>
        <button onclick="testDepartments()">🏢 Test Departments API</button>
        <div id="deptResult" class="result"></div>
    </div>

    <div class="section">
        <h2>🔍 Test 2: Fetch Positions</h2>
        <button onclick="testPositions()">💼 Test Positions API</button>
        <div id="posResult" class="result"></div>
    </div>

    <div class="section">
        <h2>🔍 Test 3: Test Both APIs</h2>
        <button onclick="testBoth()">🚀 Test Both APIs (Promise.all)</button>
        <div id="bothResult" class="result"></div>
    </div>

    <div class="section">
        <h2>📋 Test 4: Populate Dropdowns</h2>
        <button onclick="populateDropdowns()">📥 Load Data into Dropdowns</button>
        <div>
            <select id="deptDropdown">
                <option value="">Chọn phòng ban</option>
            </select>
            <select id="posDropdown">
                <option value="">Chọn chức vụ</option>
            </select>
        </div>
        <div id="dropdownResult" class="result"></div>
    </div>

    <script>
        const BASE_URL = 'http://localhost:5000';
        const API_DEPT = `${BASE_URL}/api/v1/departments/`;
        const API_POS = `${BASE_URL}/api/v1/positions/`;

        function log(elementId, message, type = 'info') {
            const element = document.getElementById(elementId);
            const timestamp = new Date().toLocaleTimeString();
            const icon = type === 'success' ? '✅' : type === 'error' ? '❌' : type === 'warning' ? '⚠️' : 'ℹ️';
            element.innerHTML += `<span class="${type}">[${timestamp}] ${icon} ${message}</span>\n`;
            element.scrollTop = element.scrollHeight;
        }

        function clearLog(elementId) {
            document.getElementById(elementId).innerHTML = '';
        }

        async function testDepartments() {
            clearLog('deptResult');
            log('deptResult', 'Fetching departments from: ' + API_DEPT);
            
            try {
                const response = await fetch(API_DEPT);
                log('deptResult', `Status: ${response.status} ${response.statusText}`, response.ok ? 'success' : 'error');
                
                const data = await response.json();
                log('deptResult', `Count: ${data.count} departments`, 'success');
                log('deptResult', 'Data: ' + JSON.stringify(data, null, 2), 'info');
                
                if (data.data && data.data.length > 0) {
                    log('deptResult', `✅ SUCCESS: Received ${data.data.length} departments`, 'success');
                    data.data.forEach((dept, index) => {
                        log('deptResult', `  ${index + 1}. ${dept.DepartmentName} (ID: ${dept.DepartmentID})`, 'info');
                    });
                } else {
                    log('deptResult', '⚠️ WARNING: No departments found', 'warning');
                }
            } catch (error) {
                log('deptResult', `❌ ERROR: ${error.message}`, 'error');
                log('deptResult', 'Possible causes:', 'error');
                log('deptResult', '  1. Backend not running at http://localhost:5000', 'error');
                log('deptResult', '  2. CORS issue', 'error');
                log('deptResult', '  3. Network error', 'error');
            }
        }

        async function testPositions() {
            clearLog('posResult');
            log('posResult', 'Fetching positions from: ' + API_POS);
            
            try {
                const response = await fetch(API_POS);
                log('posResult', `Status: ${response.status} ${response.statusText}`, response.ok ? 'success' : 'error');
                
                const data = await response.json();
                log('posResult', `Count: ${data.count} positions`, 'success');
                log('posResult', 'Data: ' + JSON.stringify(data, null, 2), 'info');
                
                if (data.data && data.data.length > 0) {
                    log('posResult', `✅ SUCCESS: Received ${data.data.length} positions`, 'success');
                    data.data.forEach((pos, index) => {
                        log('posResult', `  ${index + 1}. ${pos.PositionName} (ID: ${pos.PositionID})`, 'info');
                    });
                } else {
                    log('posResult', '⚠️ WARNING: No positions found', 'warning');
                }
            } catch (error) {
                log('posResult', `❌ ERROR: ${error.message}`, 'error');
                log('posResult', 'Possible causes:', 'error');
                log('posResult', '  1. Backend not running at http://localhost:5000', 'error');
                log('posResult', '  2. CORS issue', 'error');
                log('posResult', '  3. Network error', 'error');
            }
        }

        async function testBoth() {
            clearLog('bothResult');
            log('bothResult', 'Testing Promise.all with both APIs...');
            
            try {
                const startTime = performance.now();
                
                const [deptRes, posRes] = await Promise.all([
                    fetch(API_DEPT),
                    fetch(API_POS)
                ]);
                
                const endTime = performance.now();
                log('bothResult', `⏱️ Time taken: ${(endTime - startTime).toFixed(2)}ms`, 'info');
                
                log('bothResult', `Departments Status: ${deptRes.status}`, deptRes.ok ? 'success' : 'error');
                log('bothResult', `Positions Status: ${posRes.status}`, posRes.ok ? 'success' : 'error');
                
                const [deptData, posData] = await Promise.all([
                    deptRes.json(),
                    posRes.json()
                ]);
                
                log('bothResult', `✅ Departments: ${deptData.count} items`, 'success');
                log('bothResult', `✅ Positions: ${posData.count} items`, 'success');
                
                log('bothResult', '\n📊 Summary:', 'info');
                log('bothResult', `  Total Departments: ${deptData.data?.length || 0}`, 'success');
                log('bothResult', `  Total Positions: ${posData.data?.length || 0}`, 'success');
                
                if (deptData.data?.length > 0 && posData.data?.length > 0) {
                    log('bothResult', '\n🎉 SUCCESS: Both APIs working perfectly!', 'success');
                } else {
                    log('bothResult', '\n⚠️ WARNING: One or both APIs returned empty data', 'warning');
                }
            } catch (error) {
                log('bothResult', `❌ ERROR: ${error.message}`, 'error');
            }
        }

        async function populateDropdowns() {
            clearLog('dropdownResult');
            log('dropdownResult', 'Loading data into dropdowns...');
            
            try {
                const [deptRes, posRes] = await Promise.all([
                    fetch(API_DEPT),
                    fetch(API_POS)
                ]);
                
                const [deptData, posData] = await Promise.all([
                    deptRes.json(),
                    posRes.json()
                ]);
                
                // Populate departments dropdown
                const deptDropdown = document.getElementById('deptDropdown');
                deptDropdown.innerHTML = '<option value="">Chọn phòng ban</option>';
                deptData.data.forEach(dept => {
                    const option = document.createElement('option');
                    option.value = dept.DepartmentID;
                    option.textContent = dept.DepartmentName;
                    deptDropdown.appendChild(option);
                });
                log('dropdownResult', `✅ Loaded ${deptData.data.length} departments into dropdown`, 'success');
                
                // Populate positions dropdown
                const posDropdown = document.getElementById('posDropdown');
                posDropdown.innerHTML = '<option value="">Chọn chức vụ</option>';
                posData.data.forEach(pos => {
                    const option = document.createElement('option');
                    option.value = pos.PositionID;
                    option.textContent = pos.PositionName;
                    posDropdown.appendChild(option);
                });
                log('dropdownResult', `✅ Loaded ${posData.data.length} positions into dropdown`, 'success');
                
                log('dropdownResult', '\n🎉 SUCCESS: Dropdowns populated!', 'success');
                log('dropdownResult', 'Try selecting items from the dropdowns above.', 'info');
            } catch (error) {
                log('dropdownResult', `❌ ERROR: ${error.message}`, 'error');
            }
        }

        // Auto-test on page load
        window.addEventListener('load', () => {
            console.log('🚀 Test page loaded');
            console.log('📍 API URLs:', { API_DEPT, API_POS });
        });
    </script>
</body>
</html>
